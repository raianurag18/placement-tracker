# Render Blueprint — backend API
# Connect this repo in Render and apply the blueprint, then set env vars.
# Frontend stays on Vercel (see README Deploy section).

services:
  - type: web
    name: placerra-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
